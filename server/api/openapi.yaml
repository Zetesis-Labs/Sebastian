openapi: 3.0.3
info:
  title: Sebastian API
  version: 0.1.0
  description: Control plane for Sebastian devices and LiveKit agent sessions.
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: getLiveness
      summary: Process liveness
      tags: [system]
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: getReadiness
      summary: Dependency readiness
      tags: [system]
      responses:
        "200":
          description: The service can accept traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: A required dependency is unavailable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/sessions:
    post:
      operationId: createSession
      summary: Create a device session and dispatch its assigned agent
      tags: [sessions]
      security:
        - DeviceSecret: []
      parameters:
        - name: X-Device-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: X-Device-Secret
          in: header
          required: true
          schema:
            type: string
            minLength: 32
            maxLength: 256
      responses:
        "201":
          description: Session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: Invalid device credentials.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: LiveKit or persistence is unavailable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/devices/{deviceId}/desired-profile:
    get:
      operationId: getDesiredProfile
      summary: Desired device profile for reconciliation polls
      description: >-
        Device-facing. The firmware polls this endpoint, reporting its running
        profile via `current`, and receives the desired profile name (empty
        body when none is set). Unknown devices are auto-registered so new
        units appear in the admin inventory on first contact. Same exposure
        posture as /token: keep it off the public internet until device
        credentials land.
      tags: [devices]
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: current
          in: query
          schema:
            type: string
            maxLength: 63
        - name: cfg
          in: query
          description: Version of the config the device is running (empty = none).
          schema:
            type: string
            maxLength: 32
        - name: fw
          in: query
          description: Firmware version the device is running.
          schema:
            type: string
            maxLength: 64
      responses:
        "200":
          description: Desired profile name; empty when none is set.
          headers:
            X-Desired-Config:
              description: Version of the desired config; the device fetches it when different from `cfg`.
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
        "503":
          description: Persistence is unavailable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/devices/{deviceId}/config:
    get:
      operationId: getDeviceConfig
      summary: The desired sebastian.config.v1 document for this device
      description: >-
        Device-facing, authenticated with the per-device secret. Returned only
        when the control room holds a desired config; the document carries
        `configVersion` so the device echoes it in its next poll.
      tags: [devices]
      security:
        - DeviceSecret: []
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: X-Device-Secret
          in: header
          required: true
          schema:
            type: string
            minLength: 32
            maxLength: 256
      responses:
        "200":
          description: The desired config.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceConfig"
        "401":
          description: Invalid device credentials.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No desired config for this device.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/devices/{deviceId}/enroll:
    get:
      operationId: getEnrollmentChallenge
      summary: Challenge for a device to enrol with the organization secret
      description: >-
        Device-facing, first step of the enrolment (RF-03/RF-51): a unit
        provisioned from the embedded installer holds the organization secret
        but no device secret yet, so it asks this control room for one. The
        nonce is single-use and expires after 60 s. 404 when this control room
        has no organization secret (enrolment is not possible).
      tags: [devices]
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: The challenge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentChallenge"
        "404":
          description: Enrolment is not available on this control room.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      operationId: enrollDevice
      summary: Enrol a device that proves it holds the organization secret
      description: >-
        Second step: `mac` = hex HMAC-SHA256(organization secret, nonce + "." +
        deviceId), the same construction the LAN adoption uses. On success the
        unit is adopted by this control room and receives its device secret,
        which it stores and uses from then on for `POST /v1/sessions`.
      tags: [devices]
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentRequest"
      responses:
        "201":
          description: Enrolled; the device secret, delivered once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentResponse"
        "401":
          description: The nonce is unknown, expired or the proof does not match.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Enrolment is not available on this control room.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/admin/control-room:
    get:
      operationId: getControlRoom
      summary: This control room's identity and provisioning defaults
      description: >-
        What the embedded installer pre-fills and what adoption writes into a
        device. The organization secret is included: this endpoint is behind
        the administration secret and must only be called server-side.
      tags: [administration]
      security:
        - AdminSecret: []
      responses:
        "200":
          description: Control room settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlRoom"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/admin/devices:
    get:
      operationId: listDevices
      summary: The fleet view — known devices joined with what mDNS sees on the LAN
      tags: [administration, devices]
      security:
        - AdminSecret: []
      responses:
        "200":
          description: Devices ordered by id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/admin/devices/{deviceId}:
    get:
      operationId: getDevice
      summary: One device with its desired config and recent sessions
      tags: [administration, devices]
      security:
        - AdminSecret: []
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: Device detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/DeviceNotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    patch:
      operationId: updateDevice
      summary: Rename a device
      tags: [administration, devices]
      security:
        - AdminSecret: []
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceUpdate"
      responses:
        "204":
          description: Updated.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/DeviceNotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/admin/devices/{deviceId}/adopt:
    post:
      operationId: adoptDevice
      summary: Adopt a device over the network (discovered, or by IP)
      description: >-
        Starts an adoption job: hello/nonce, then the control room's config
        signed with the organization secret (or the device secret supplied in
        the body). The job reports progress (waiting for the MUTE button on a
        factory unit, queued behind a conversation) and, once adopted, the
        per-device secret — shown once.
      tags: [administration, devices, adoption]
      security:
        - AdminSecret: []
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdoptionRequest"
      responses:
        "202":
          description: Adoption started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdoptionJob"
        "400":
          description: No address for the device (not seen on the LAN and no `ip` given).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/admin/devices/{deviceId}/forget:
    post:
      operationId: forgetDevice
      summary: Return a device to factory (unadopted) and drop it from the inventory
      tags: [administration, devices, adoption]
      security:
        - AdminSecret: []
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdoptionRequest"
      responses:
        "202":
          description: Forget started (the device is told over the network, then removed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdoptionJob"
        "400":
          description: No address for the device.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/DeviceNotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/admin/adoptions/{jobId}:
    get:
      operationId: getAdoptionJob
      summary: Progress of an adoption or forget job
      tags: [administration, adoption]
      security:
        - AdminSecret: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Job state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdoptionJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown or expired job.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/admin/devices/{deviceId}/desired-config:
    put:
      operationId: setDesiredConfig
      summary: Set the desired sebastian.config.v1 for a device
      description: >-
        Stored with a version; the device picks it up on its next poll, stores
        it and restarts. WiFi changes are applied by the device as a trial with
        automatic rollback.
      tags: [administration, devices]
      security:
        - AdminSecret: []
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceConfig"
      responses:
        "200":
          description: Stored; returns the assigned version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesiredConfigVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/DeviceNotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: clearDesiredConfig
      summary: Clear the desired config
      tags: [administration, devices]
      security:
        - AdminSecret: []
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "204":
          description: Cleared.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/DeviceNotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/admin/devices/{deviceId}/secret:
    post:
      operationId: regenerateDeviceSecret
      summary: Issue a new per-device secret (shown once)
      description: >-
        The new secret reaches the device inside its next desired config; the
        old one keeps working until the device first authenticates with the new
        one.
      tags: [administration, devices, adoption]
      security:
        - AdminSecret: []
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: The new secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceSecret"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/DeviceNotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/admin/devices/{deviceId}/desired-profile:
    put:
      operationId: setDesiredProfile
      summary: Set (or clear) the desired device profile
      tags: [administration, devices]
      security:
        - AdminSecret: []
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DesiredProfile"
      responses:
        "204":
          description: Desired profile stored; the device applies it on its next poll.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Device not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/admin/recordings:
    get:
      operationId: listRecordings
      summary: List recent voice recordings
      tags: [administration, recordings]
      security:
        - AdminSecret: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Recent recordings ordered by capture time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: registerRecording
      summary: Register a recording already stored in object storage
      tags: [administration, recordings]
      security:
        - AdminSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordingRegistration"
      responses:
        "201":
          description: Recording registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recording"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The associated session does not exist.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The object URL is already registered.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/admin/recordings/summary:
    get:
      operationId: getRecordingsSummary
      summary: Aggregate recording storage and duration metrics
      tags: [administration, recordings]
      security:
        - AdminSecret: []
      responses:
        "200":
          description: Recording summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/admin/recordings/{recordingId}:
    get:
      operationId: getRecording
      summary: Get one voice recording
      tags: [administration, recordings]
      security:
        - AdminSecret: []
      parameters:
        - name: recordingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Recording details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recording"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Recording not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/Unavailable"
  /token:
    get:
      operationId: getLegacyToken
      summary: Firmware-compatible two-line LiveKit connection response
      description: Transitional endpoint. It must be explicitly enabled and should not be exposed publicly.
      deprecated: true
      tags: [compatibility]
      responses:
        "200":
          description: LiveKit URL followed by the JWT, separated by a newline.
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: The compatibility endpoint is disabled.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: LiveKit or persistence is unavailable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  securitySchemes:
    DeviceSecret:
      type: apiKey
      in: header
      name: X-Device-Secret
    AdminSecret:
      type: apiKey
      in: header
      name: X-Admin-Secret
  parameters:
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
  responses:
    DeviceNotFound:
      description: Device not found.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: The administration secret is invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unavailable:
      description: A required dependency is unavailable.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Session:
      type: object
      additionalProperties: false
      required: [id, room, serverUrl, token, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        room:
          type: string
        serverUrl:
          type: string
          format: uri
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
    RecordingKind:
      type: string
      enum: [model, microphone, agent, composite]
    Recording:
      type: object
      additionalProperties: false
      required: [id, sessionId, room, kind, fileName, objectUrl, contentType, byteSize, durationMs, capturedAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        room:
          type: string
        kind:
          $ref: "#/components/schemas/RecordingKind"
        fileName:
          type: string
        objectUrl:
          type: string
          format: uri
        contentType:
          type: string
        byteSize:
          type: integer
          format: int64
          minimum: 0
        durationMs:
          type: integer
          format: int64
          minimum: 0
        capturedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        transcript:
          type: string
    RecordingRegistration:
      type: object
      additionalProperties: false
      required: [room, kind, fileName, objectUrl, contentType, byteSize, durationMs, capturedAt]
      properties:
        room:
          type: string
          minLength: 1
        kind:
          $ref: "#/components/schemas/RecordingKind"
        fileName:
          type: string
          minLength: 1
        objectUrl:
          type: string
          format: uri
        contentType:
          type: string
          minLength: 1
        byteSize:
          type: integer
          format: int64
          minimum: 0
        durationMs:
          type: integer
          format: int64
          minimum: 0
        capturedAt:
          type: string
          format: date-time
        transcript:
          type: string
    RecordingList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Recording"
    DeviceState:
      type: string
      description: >-
        adopted = bound here and polling; absent = bound here, silent for more
        than three poll periods and not on the LAN; managed_elsewhere = seen on
        the LAN, bound to another control room; unadopted = seen on the LAN,
        bound to none; orphan = seen on the LAN, bound to a control room it
        cannot reach; registered = polled this control room without being
        adopted (legacy /token units).
      enum: [adopted, absent, managed_elsewhere, unadopted, orphan, registered]
    Device:
      type: object
      additionalProperties: false
      required: [id, displayName, enabled, state]
      properties:
        id:
          type: string
        displayName:
          type: string
        enabled:
          type: boolean
        state:
          $ref: "#/components/schemas/DeviceState"
        adoptedAt:
          type: string
          format: date-time
        desiredProfile:
          type: string
        reportedProfile:
          type: string
        profileReportedAt:
          type: string
          format: date-time
        firmware:
          type: string
        ip:
          type: string
        controlRoom:
          type: string
          description: Origin the device announces it is bound to (may be another control room).
        lastError:
          type: string
          description: What the device reports about its last control-room contact (empty = ok).
        reportedConfigVersion:
          type: string
        desiredConfigVersion:
          type: string
        seenOnLanAt:
          type: string
          format: date-time
    DeviceDetail:
      allOf:
        - $ref: "#/components/schemas/Device"
        - type: object
          additionalProperties: false
          required: [hasDeviceSecret, sessions]
          properties:
            hasDeviceSecret:
              type: boolean
            desiredConfig:
              $ref: "#/components/schemas/DeviceConfig"
            sessions:
              type: array
              items:
                $ref: "#/components/schemas/DeviceSession"
    DeviceSession:
      type: object
      additionalProperties: false
      required: [id, room, createdAt, expiresAt, recordingCount]
      properties:
        id:
          type: string
          format: uuid
        room:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        recordingCount:
          type: integer
          format: int64
          minimum: 0
    DeviceUpdate:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 64
    DeviceConfig:
      type: object
      description: A sebastian.config.v1 document (see web-installer/public/PROVISIONING.md). Validated by the firmware.
      additionalProperties: true
    DesiredConfigVersion:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: string
    DeviceSecret:
      type: object
      additionalProperties: false
      required: [deviceSecret]
      properties:
        deviceSecret:
          type: string
    ControlRoom:
      type: object
      additionalProperties: false
      required: [name, apiUrl, discoveryEnabled, adoptPort, orgSecretConfigured]
      properties:
        name:
          type: string
        apiUrl:
          type: string
          description: The URL devices use to reach this control room (token server).
        syslogIp:
          type: string
        syslogPort:
          type: integer
        discoveryEnabled:
          type: boolean
        adoptPort:
          type: integer
        orgSecretConfigured:
          type: boolean
        orgSecret:
          type: string
          description: Present only for server-side callers; never ship to a browser.
    AdoptionRequest:
      type: object
      additionalProperties: false
      properties:
        ip:
          type: string
          description: Address of the device when it was not discovered (adopt by IP).
        deviceSecret:
          type: string
          description: Sign with this device secret instead of the organization secret (handover of a single unit).
        config:
          $ref: "#/components/schemas/DeviceConfig"
    AdoptionPhase:
      type: string
      enum: [starting, waiting_consent, queued, adopted, forgotten, failed]
    AdoptionJob:
      type: object
      additionalProperties: false
      required: [id, deviceId, kind, phase, startedAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        deviceId:
          type: string
        kind:
          type: string
          enum: [adopt, forget]
        ip:
          type: string
        phase:
          $ref: "#/components/schemas/AdoptionPhase"
        error:
          type: string
          description: Why it failed — auth, nonce, no_reply, consent_timeout, wifi, json…
        deviceSecret:
          type: string
          description: The per-device secret issued by this adoption. Shown once; the job expires.
        startedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DeviceList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Device"
    EnrollmentChallenge:
      type: object
      additionalProperties: false
      required: [nonce]
      properties:
        nonce:
          type: string
          minLength: 64
          maxLength: 64
          pattern: "^[0-9a-f]{64}$"
    EnrollmentRequest:
      type: object
      additionalProperties: false
      required: [nonce, mac]
      properties:
        nonce:
          type: string
          minLength: 64
          maxLength: 64
        mac:
          type: string
          minLength: 64
          maxLength: 64
          description: hex HMAC-SHA256(organization secret, nonce + "." + deviceId)
    EnrollmentResponse:
      type: object
      additionalProperties: false
      required: [deviceSecret]
      properties:
        deviceSecret:
          type: string
          minLength: 32
          maxLength: 256
    DesiredProfile:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 63
          description: Firmware profile name. Empty or absent clears the desired state.
    RecordingSummary:
      type: object
      additionalProperties: false
      required: [count, totalBytes, totalDurationMs]
      properties:
        count:
          type: integer
          format: int64
          minimum: 0
        totalBytes:
          type: integer
          format: int64
          minimum: 0
        totalDurationMs:
          type: integer
          format: int64
          minimum: 0
        lastCapturedAt:
          type: string
          format: date-time
