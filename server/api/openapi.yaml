openapi: 3.0.3
info:
  title: Sebastian API
  version: 0.1.0
  description: Control plane for Sebastian devices and LiveKit agent sessions.
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: getLiveness
      summary: Process liveness
      tags: [system]
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: getReadiness
      summary: Dependency readiness
      tags: [system]
      responses:
        "200":
          description: The service can accept traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: A required dependency is unavailable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/sessions:
    post:
      operationId: createSession
      summary: Create a device session and dispatch its assigned agent
      description: >-
        With `kind=meeting` the agent is dispatched in meeting mode for that
        meeting (design 14 §3.2); with `kind=announce` it says the announcement
        the unit was ordered to fetch, and `listen` tells the unit whether to
        open its microphone.
      tags: [sessions]
      security:
        - DeviceSecret: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRequest"
      parameters:
        - name: X-Device-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: X-Device-Secret
          in: header
          required: true
          schema:
            type: string
            minLength: 32
            maxLength: 256
      responses:
        "201":
          description: Session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: Invalid device credentials.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: The announcement is unknown to this unit, already said or expired.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: LiveKit or persistence is unavailable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/devices/{deviceId}/desired-profile:
    get:
      operationId: getDesiredProfile
      summary: Desired device profile for reconciliation polls
      description: >-
        Device-facing. The firmware polls this endpoint, reporting its running
        profile via `current`, and receives the desired profile name (empty
        body when none is set). Unknown devices are auto-registered so new
        units appear in the admin inventory on first contact.
      tags: [devices]
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: current
          in: query
          schema:
            type: string
            maxLength: 63
        - name: cfg
          in: query
          description: Version of the config the device is running (empty = none).
          schema:
            type: string
            maxLength: 32
        - name: fw
          in: query
          description: Firmware version the device is running.
          schema:
            type: string
            maxLength: 64
        - name: ev
          in: query
          description: "The unit's last event worth telling the owner (RF-36/42): adopt-denied:<ip>, cfg-rejected:<why>, or the error recorded by its previous boot. Empty when none."
          schema:
            type: string
            maxLength: 64
      responses:
        "200":
          description: Desired profile name; empty when none is set.
          headers:
            X-Desired-Config:
              description: Version of the desired config; the device fetches it when different from `cfg`.
              schema:
                type: string
            X-Meeting:
              description: "A pending meeting order (RM-06): start:<meetingId> or stop:<meetingId>. Absent when none."
              schema:
                type: string
            X-Announce:
              description: "The oldest announcement the unit has not claimed: start:<announcementId>. Absent when none."
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
        "503":
          description: Persistence is unavailable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/devices/{deviceId}/config:
    get:
      operationId: getDeviceConfig
      summary: The desired sebastian.config.v1 document for this device
      description: >-
        Device-facing, authenticated with the per-device secret. Returned only
        when the control room holds a desired config; the document carries
        `configVersion` so the device echoes it in its next poll.
      tags: [devices]
      security:
        - DeviceSecret: []
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: X-Device-Secret
          in: header
          required: true
          schema:
            type: string
            minLength: 32
            maxLength: 256
      responses:
        "200":
          description: The desired config.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceConfig"
        "401":
          description: Invalid device credentials.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No desired config for this device.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/devices/{deviceId}/enroll:
    get:
      operationId: getEnrollmentChallenge
      summary: Challenge for a device to enrol with the organization secret
      description: >-
        Device-facing, first step of the enrolment (RF-03/RF-51): a unit
        provisioned from the embedded installer holds the organization secret
        but no device secret yet, so it asks this control room for one. The
        nonce is single-use and expires after 60 s. 404 when this control room
        has no organization secret (enrolment is not possible).
      tags: [devices]
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: The challenge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentChallenge"
        "404":
          description: Enrolment is not available on this control room.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      operationId: enrollDevice
      summary: Enrol a device that proves it holds the organization secret
      description: >-
        Second step: `mac` = hex HMAC-SHA256(organization secret, nonce + "." +
        deviceId), the same construction the LAN adoption uses, and the unit's
        own device secret (born with the unit). On success the control room
        adopts the unit and keeps the secret's digest for `POST /v1/sessions`.
      tags: [devices]
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentRequest"
      responses:
        "201":
          description: "Enrolled: this control room holds the unit's secret now."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentResponse"
        "401":
          description: The nonce is unknown, expired or the proof does not match.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Enrolment is not available on this control room.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/devices/{deviceId}/running-config:
    put:
      operationId: reportRunningConfig
      summary: The device reports the configuration it runs (RF-42)
      description: >-
        Device-facing, authenticated with the device secret. Sent at boot (every
        applied change reboots), without secrets or the WiFi password. The
        ficha shows it as the "running" column and seeds its form from it.
      tags: [devices]
      security:
        - DeviceSecret: []
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - name: X-Device-Secret
          in: header
          required: true
          schema:
            type: string
            minLength: 32
            maxLength: 256
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceConfig"
      responses:
        "204":
          description: Recorded.
        "401":
          description: Invalid device credentials.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/admin/control-room:
    get:
      operationId: getControlRoom
      summary: This control room's identity and provisioning defaults
      description: >-
        What the embedded installer pre-fills and what adoption writes into a
        device. The organization secret is included: this endpoint is behind
        the administration secret and must only be called server-side.
      tags: [administration]
      security:
        - AdminSecret: []
      responses:
        "200":
          description: Control room settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlRoom"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/admin/devices:
    get:
      operationId: listDevices
      summary: The fleet view — known devices joined with what mDNS sees on the LAN
      tags: [administration, devices]
      security:
        - AdminSecret: []
      responses:
        "200":
          description: Devices ordered by id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/admin/devices/{deviceId}:
    get:
      operationId: getDevice
      summary: One device with its desired config and recent sessions
      tags: [administration, devices]
      security:
        - AdminSecret: []
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: Device detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/DeviceNotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    patch:
      operationId: updateDevice
      summary: Rename a device or change the agent it talks through
      tags: [administration, devices]
      security:
        - AdminSecret: []
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceUpdate"
      responses:
        "204":
          description: Updated.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/DeviceNotFound"
        "422":
          $ref: "#/components/responses/AgentProfileNotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/admin/devices/{deviceId}/adopt:
    post:
      operationId: adoptDevice
      summary: Adopt a device over the network (discovered, or by IP)
      description: >-
        Starts an adoption job: hello/nonce, then the control room's config
        signed with the organization secret (or the device secret supplied in
        the body). The job reports progress (waiting for the MUTE button on a
        factory unit, queued behind a conversation) and, once adopted, the
        per-device secret — shown once.
      tags: [administration, devices, adoption]
      security:
        - AdminSecret: []
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdoptionRequest"
      responses:
        "202":
          description: Adoption started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdoptionJob"
        "400":
          description: No address for the device (not seen on the LAN and no `ip` given).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/admin/devices/{deviceId}/forget:
    post:
      operationId: forgetDevice
      summary: Return a device to factory (unadopted) and drop it from the inventory
      tags: [administration, devices, adoption]
      security:
        - AdminSecret: []
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdoptionRequest"
      responses:
        "202":
          description: Forget started (the device is told over the network, then removed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdoptionJob"
        "400":
          description: No address for the device.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/DeviceNotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/admin/adoptions/{jobId}:
    get:
      operationId: getAdoptionJob
      summary: Progress of an adoption or forget job
      tags: [administration, adoption]
      security:
        - AdminSecret: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Job state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdoptionJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown or expired job.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/admin/devices/{deviceId}/desired-config:
    put:
      operationId: setDesiredConfig
      summary: Set the desired sebastian.config.v1 for a device
      description: >-
        Stored with a version; the device picks it up on its next poll, stores
        it and restarts. WiFi changes are applied by the device as a trial with
        automatic rollback.
      tags: [administration, devices]
      security:
        - AdminSecret: []
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceConfig"
      responses:
        "200":
          description: Stored; returns the assigned version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesiredConfigVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/DeviceNotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: clearDesiredConfig
      summary: Clear the desired config
      tags: [administration, devices]
      security:
        - AdminSecret: []
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "204":
          description: Cleared.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/DeviceNotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/admin/devices/{deviceId}/secret:
    post:
      operationId: regenerateDeviceSecret
      summary: Issue a new per-device secret (shown once)
      description: >-
        The new secret reaches the device inside its next desired config; the
        old one keeps working until the device first authenticates with the new
        one.
      tags: [administration, devices, adoption]
      security:
        - AdminSecret: []
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: The new secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceSecret"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/DeviceNotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/admin/devices/{deviceId}/desired-profile:
    put:
      operationId: setDesiredProfile
      summary: Set (or clear) the desired device profile
      tags: [administration, devices]
      security:
        - AdminSecret: []
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DesiredProfile"
      responses:
        "204":
          description: Desired profile stored; the device applies it on its next poll.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Device not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/admin/agent-profiles:
    get:
      operationId: listAgentProfiles
      summary: The agents a speaker can talk through, from Kubernetes and from the panel
      tags: [administration, agents]
      security:
        - AdminSecret: []
      responses:
        "200":
          description: Agent profiles, Kubernetes-managed first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentProfileList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: createAgentProfile
      summary: Create an agent profile owned by the panel
      tags: [administration, agents]
      security:
        - AdminSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentProfileInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/AgentProfileConflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/admin/agent-profiles/{profileId}:
    patch:
      operationId: updateAgentProfile
      summary: Change a panel-owned agent profile
      tags: [administration, agents]
      security:
        - AdminSecret: []
      parameters:
        - $ref: "#/components/parameters/AgentProfileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentProfileInput"
      responses:
        "200":
          description: Updated; speakers use it from their next session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AgentProfileNotFound"
        "409":
          $ref: "#/components/responses/AgentProfileConflict"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: deleteAgentProfile
      summary: Delete a panel-owned agent profile no speaker uses
      tags: [administration, agents]
      security:
        - AdminSecret: []
      parameters:
        - $ref: "#/components/parameters/AgentProfileId"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AgentProfileNotFound"
        "409":
          $ref: "#/components/responses/AgentProfileConflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/admin/agent-profiles/{profileId}/api-key:
    put:
      operationId: setAgentProfileApiKey
      summary: Store the provider API key of an agent profile (write-only, encrypted at rest)
      tags: [administration, agents]
      security:
        - AdminSecret: []
      parameters:
        - $ref: "#/components/parameters/AgentProfileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentProfileApiKey"
      responses:
        "204":
          description: Stored; it replaces the agent's environment key from the next session.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AgentProfileNotFound"
        "409":
          $ref: "#/components/responses/AgentProfileConflict"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: clearAgentProfileApiKey
      summary: Forget the stored API key; the agent falls back to its environment
      tags: [administration, agents]
      security:
        - AdminSecret: []
      parameters:
        - $ref: "#/components/parameters/AgentProfileId"
      responses:
        "204":
          description: Cleared.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AgentProfileNotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/admin/devices/{deviceId}/announcements:
    post:
      operationId: createAnnouncement
      summary: Make the unit say something
      description: >-
        A unit in a conversation says it at the next pause. An idle unit is
        ordered over the LAN, signed with the organization secret, and by its
        next poll, to open an announce session: the agent plays a chime, says
        the text in the voice of the unit's agent profile and, with `reply`,
        stays listening for an answer. The order expires after two minutes.
      tags: [administration]
      security:
        - AdminSecret: []
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementInput"
      responses:
        "202":
          description: Announcement accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/DeviceNotFound"
        "409":
          description: The unit is recording a meeting.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: >-
            The unit cannot say it: empty or too long a text, not adopted
            here, not in the agente profile or not contacting.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/admin/devices/{deviceId}/meetings:
    post:
      operationId: startMeeting
      summary: Ask the unit to record a meeting (RM-03)
      description: >-
        Creates a meeting in state `requested` and sends the unit the order
        over the LAN, signed with the organization secret; the unit's next
        poll carries it too (RM-06). One meeting per unit (RM-05); only in
        the agente profile (RM-44).
      tags: [administration, meetings]
      security:
        - AdminSecret: []
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeetingStart"
      responses:
        "202":
          description: Meeting requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meeting"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/DeviceNotFound"
        "409":
          description: A meeting is already in progress on this unit (RM-05).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The unit cannot record (not adopted here, or not in the agente profile).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/admin/meetings:
    get:
      operationId: listMeetings
      summary: Meetings, newest first (RM-40)
      tags: [administration, meetings]
      security:
        - AdminSecret: []
      parameters:
        - name: deviceId
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            $ref: "#/components/schemas/MeetingState"
        - name: q
          in: query
          description: Text to find in the transcript or the summary (RM-42).
          schema:
            type: string
            maxLength: 200
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Meetings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/admin/meetings/{meetingId}:
    get:
      operationId: getMeeting
      summary: One meeting (RM-41)
      tags: [administration, meetings]
      security:
        - AdminSecret: []
      parameters:
        - $ref: "#/components/parameters/MeetingId"
      responses:
        "200":
          description: The meeting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meeting"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/MeetingNotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    patch:
      operationId: updateMeeting
      summary: Rename speakers and flag the meeting to keep (RM-31, RM-45)
      tags: [administration, meetings]
      security:
        - AdminSecret: []
      parameters:
        - $ref: "#/components/parameters/MeetingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeetingPatch"
      responses:
        "200":
          description: The meeting as updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meeting"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/MeetingNotFound"
        "409":
          description: There is no transcript whose speakers could be renamed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: deleteMeeting
      summary: Delete audio and content irreversibly, keeping the trace (RM-46)
      tags: [administration, meetings]
      security:
        - AdminSecret: []
      parameters:
        - $ref: "#/components/parameters/MeetingId"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/MeetingNotFound"
        "409":
          description: The meeting is still in progress.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/admin/meetings/{meetingId}/transcript:
    get:
      operationId: getMeetingTranscript
      summary: The transcript as a download, txt or srt (RM-41)
      tags: [administration, meetings]
      security:
        - AdminSecret: []
      parameters:
        - $ref: "#/components/parameters/MeetingId"
        - name: format
          in: query
          schema:
            type: string
            enum: [txt, srt]
            default: txt
      responses:
        "200":
          description: The transcript.
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/MeetingNotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/admin/meetings/{meetingId}/transcribe:
    post:
      operationId: transcribeMeeting
      summary: Transcribe again (RM-33)
      tags: [administration, meetings]
      security:
        - AdminSecret: []
      parameters:
        - $ref: "#/components/parameters/MeetingId"
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meeting"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/MeetingNotFound"
        "409":
          description: The meeting is in progress, already transcribing, or has no audio.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/admin/meetings/{meetingId}/summarize:
    post:
      operationId: summarizeMeeting
      summary: Generate the summary again (RM-32)
      tags: [administration, meetings]
      security:
        - AdminSecret: []
      parameters:
        - $ref: "#/components/parameters/MeetingId"
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meeting"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/MeetingNotFound"
        "409":
          description: There is no transcript to summarize.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/admin/meetings/{meetingId}/stop:
    post:
      operationId: stopMeeting
      summary: Stop a meeting (RM-22; the agent uses it for RM-21)
      tags: [administration, meetings]
      security:
        - AdminSecret: []
      parameters:
        - $ref: "#/components/parameters/MeetingId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeetingStop"
      responses:
        "202":
          description: Stopping.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meeting"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/MeetingNotFound"
        "409":
          description: The meeting is not in progress.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/devices/{deviceId}/meetings:
    post:
      operationId: requestMeeting
      summary: The unit asks for a meeting after the MUTE gesture (RM-02)
      tags: [devices, meetings]
      security:
        - DeviceSecret: []
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - name: X-Device-Secret
          in: header
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Meeting requested; the unit starts it with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meeting"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: A meeting is already in progress on this unit (RM-05).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The unit cannot record (not adopted here, not contacting, or not in the agente profile).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/devices/{deviceId}/meeting:
    put:
      operationId: reportMeeting
      summary: The unit confirms it records, or that it stopped and why (RM-52)
      tags: [devices, meetings]
      security:
        - DeviceSecret: []
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - name: X-Device-Secret
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeetingReport"
      responses:
        "204":
          description: Recorded.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/MeetingNotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/admin/recordings:
    get:
      operationId: listRecordings
      summary: List recent voice recordings
      tags: [administration, recordings]
      security:
        - AdminSecret: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Recent recordings ordered by capture time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: registerRecording
      summary: Register a recording already stored in object storage
      tags: [administration, recordings]
      security:
        - AdminSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordingRegistration"
      responses:
        "201":
          description: Recording registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recording"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The associated session does not exist.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The object URL is already registered.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/admin/recordings/summary:
    get:
      operationId: getRecordingsSummary
      summary: Aggregate recording storage and duration metrics
      tags: [administration, recordings]
      security:
        - AdminSecret: []
      responses:
        "200":
          description: Recording summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/admin/recordings/{recordingId}:
    get:
      operationId: getRecording
      summary: Get one voice recording
      tags: [administration, recordings]
      security:
        - AdminSecret: []
      parameters:
        - name: recordingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Recording details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recording"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Recording not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/Unavailable"
components:
  securitySchemes:
    DeviceSecret:
      type: apiKey
      in: header
      name: X-Device-Secret
    AdminSecret:
      type: apiKey
      in: header
      name: X-Admin-Secret
  parameters:
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    MeetingId:
      name: meetingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgentProfileId:
      name: profileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    AgentProfileNotFound:
      description: The agent profile does not exist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    AgentProfileConflict:
      description: The name is taken, the profile is managed by Kubernetes, or speakers still use it.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    MeetingNotFound:
      description: The meeting does not exist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    DeviceNotFound:
      description: Device not found.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: The administration secret is invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unavailable:
      description: A required dependency is unavailable.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Session:
      type: object
      additionalProperties: false
      required: [id, room, serverUrl, token, expiresAt, listen]
      properties:
        listen:
          type: boolean
          description: Open the microphone; false for an announcement that only speaks.
        id:
          type: string
          format: uuid
        room:
          type: string
        serverUrl:
          type: string
          format: uri
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
    RecordingKind:
      type: string
      enum: [model, microphone, agent, composite]
    Recording:
      type: object
      additionalProperties: false
      required: [id, sessionId, room, kind, fileName, objectUrl, contentType, byteSize, durationMs, capturedAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        room:
          type: string
        kind:
          $ref: "#/components/schemas/RecordingKind"
        fileName:
          type: string
        objectUrl:
          type: string
          format: uri
        contentType:
          type: string
        byteSize:
          type: integer
          format: int64
          minimum: 0
        durationMs:
          type: integer
          format: int64
          minimum: 0
        capturedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        transcript:
          type: string
    RecordingRegistration:
      type: object
      additionalProperties: false
      required: [room, kind, fileName, objectUrl, contentType, byteSize, durationMs, capturedAt]
      properties:
        room:
          type: string
          minLength: 1
        kind:
          $ref: "#/components/schemas/RecordingKind"
        fileName:
          type: string
          minLength: 1
        objectUrl:
          type: string
          format: uri
        contentType:
          type: string
          minLength: 1
        byteSize:
          type: integer
          format: int64
          minimum: 0
        durationMs:
          type: integer
          format: int64
          minimum: 0
        capturedAt:
          type: string
          format: date-time
        transcript:
          type: string
    RecordingList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Recording"
    DeviceState:
      type: string
      description: >-
        adopted = bound here and polling; joining = adopted here, waiting for
        its first contact since the adoption (it is rebooting; up to 3 min);
        absent = bound here, silent for more than three poll periods and not on
        the LAN; moved = adopted here but the LAN announces it bound to another
        control room after its last contact with us (someone took it);
        leaving = forgotten here, the LAN still carries its old announce;
        managed_elsewhere = seen on the LAN, bound to another control room;
        unadopted = seen on the LAN, bound to none; orphan = seen on the LAN,
        bound to a control room it cannot reach; registered = polled this
        control room without being adopted (legacy /token units).
      enum: [adopted, joining, absent, moved, leaving, managed_elsewhere, unadopted, orphan, registered]
    Device:
      type: object
      additionalProperties: false
      required: [id, displayName, enabled, state]
      properties:
        id:
          type: string
        displayName:
          type: string
        enabled:
          type: boolean
        state:
          $ref: "#/components/schemas/DeviceState"
        adoptedAt:
          type: string
          format: date-time
        desiredProfile:
          type: string
        reportedProfile:
          type: string
        profileReportedAt:
          type: string
          format: date-time
        firmware:
          type: string
        ip:
          type: string
        controlRoom:
          type: string
          description: Origin the device announces it is bound to (may be another control room).
        lastError:
          type: string
          description: What the device reports about its last control-room contact (empty = ok).
        lastEvent:
          type: string
          description: "The unit's last event worth telling the owner (RF-36/42): adopt-denied:<ip>, cfg-rejected:<why>, or the error of its previous boot. Kept until the unit reports another."
        lastEventAt:
          type: string
          format: date-time
          description: When this control room first saw lastEvent.
        reportedConfigVersion:
          type: string
        desiredConfigVersion:
          type: string
        seenOnLanAt:
          type: string
          format: date-time
        meetingSilenceMin:
          type: integer
          description: Minutes without voice that end a meeting recording (RM-23).
        meetingMaxHours:
          type: integer
          description: Maximum length of a meeting recording (RM-24).
        agentProfileId:
          type: string
          format: uuid
          description: The agent the speaker talks through; absent = it cannot open sessions yet.
        agentProfileName:
          type: string
    DeviceDetail:
      allOf:
        - $ref: "#/components/schemas/Device"
        - type: object
          additionalProperties: false
          required: [hasDeviceSecret, sessions]
          properties:
            hasDeviceSecret:
              type: boolean
            runningConfig:
              $ref: "#/components/schemas/DeviceConfig"
            runningConfigAt:
              type: string
              format: date-time
            desiredConfig:
              $ref: "#/components/schemas/DeviceConfig"
            sessions:
              type: array
              items:
                $ref: "#/components/schemas/DeviceSession"
    DeviceSession:
      type: object
      additionalProperties: false
      required: [id, room, createdAt, expiresAt, recordingCount]
      properties:
        id:
          type: string
          format: uuid
        room:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        recordingCount:
          type: integer
          format: int64
          minimum: 0
    DeviceUpdate:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 64
        agentProfileId:
          type: string
          format: uuid
          description: Talk through this agent from the next session.
        meetingSilenceMin:
          type: integer
          minimum: 5
          maximum: 60
          description: Minutes without voice that end a meeting recording (RM-23).
        meetingMaxHours:
          type: integer
          minimum: 1
          maximum: 8
          description: A recording never exceeds this (RM-24).
    DeviceConfig:
      type: object
      description: A sebastian.config.v1 document (see web-installer/public/PROVISIONING.md). Validated by the firmware.
      additionalProperties: true
    DesiredConfigVersion:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: string
    DeviceSecret:
      type: object
      additionalProperties: false
      required: [deviceSecret]
      properties:
        deviceSecret:
          type: string
    ControlRoom:
      type: object
      additionalProperties: false
      required: [name, apiUrl, discoveryEnabled, adoptPort, orgSecretConfigured]
      properties:
        name:
          type: string
        apiUrl:
          type: string
          description: The URL devices use to reach this control room (token server).
        syslogIp:
          type: string
        syslogPort:
          type: integer
        discoveryEnabled:
          type: boolean
        adoptPort:
          type: integer
        orgSecretConfigured:
          type: boolean
        orgSecret:
          type: string
          description: Present only for server-side callers; never ship to a browser.
    AdoptionRequest:
      type: object
      additionalProperties: false
      properties:
        ip:
          type: string
          description: Address of the device when it was not discovered (adopt by IP).
        deviceSecret:
          type: string
          description: Sign with this device secret instead of the organization secret (handover of a single unit).
        config:
          $ref: "#/components/schemas/DeviceConfig"
    AdoptionPhase:
      type: string
      enum: [starting, waiting_consent, queued, adopted, forgotten, failed]
    AdoptionJob:
      type: object
      additionalProperties: false
      required: [id, deviceId, kind, phase, startedAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        deviceId:
          type: string
        kind:
          type: string
          enum: [adopt, forget]
        ip:
          type: string
        phase:
          $ref: "#/components/schemas/AdoptionPhase"
        error:
          type: string
          description: Why it failed — auth, nonce, no_reply, consent_timeout, wifi, json…
        deviceSecret:
          type: string
          description: The per-device secret issued by this adoption. Shown once; the job expires.
        startedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DeviceList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Device"
    AgentProvider:
      type: string
      enum: [gemini, openai, phonic]
    AgentProfileSource:
      type: string
      enum: [kubernetes, panel]
      description: kubernetes = declared in the server's agent profiles file and read-only here.
    AgentProfileInput:
      type: object
      additionalProperties: false
      required: [name, provider]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        provider:
          $ref: "#/components/schemas/AgentProvider"
        model:
          type: string
          maxLength: 128
          description: Empty = the agent's default model for the provider.
        voice:
          type: string
          maxLength: 64
          description: Empty = the agent's default voice for the provider.
        language:
          type: string
          maxLength: 16
          description: ISO 639-1 code (es, en…); empty = the provider decides.
    AgentProfile:
      type: object
      additionalProperties: false
      required: [id, name, source, apiKeySet, deviceCount, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        source:
          $ref: "#/components/schemas/AgentProfileSource"
        provider:
          $ref: "#/components/schemas/AgentProvider"
          description: Absent on legacy profiles = the agent's environment provider; such a profile cannot hold a key.
        model:
          type: string
        voice:
          type: string
        language:
          type: string
        apiKeySet:
          type: boolean
          description: A key is stored for this profile; otherwise the agent uses its environment key.
        apiKeyUpdatedAt:
          type: string
          format: date-time
        deviceCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AgentProfileList:
      type: object
      additionalProperties: false
      required: [items, secretsKeyConfigured]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AgentProfile"
        secretsKeyConfigured:
          type: boolean
          description: False = the server has no SEBASTIAN_SECRETS_KEY and cannot store API keys.
    AgentProfileApiKey:
      type: object
      additionalProperties: false
      required: [apiKey]
      properties:
        apiKey:
          type: string
          minLength: 8
          maxLength: 512
    EnrollmentChallenge:
      type: object
      additionalProperties: false
      required: [nonce]
      properties:
        nonce:
          type: string
          minLength: 64
          maxLength: 64
          pattern: "^[0-9a-f]{64}$"
    EnrollmentRequest:
      type: object
      additionalProperties: false
      required: [nonce, mac, deviceSecret]
      properties:
        nonce:
          type: string
          minLength: 64
          maxLength: 64
        mac:
          type: string
          minLength: 64
          maxLength: 64
          description: hex HMAC-SHA256(organization secret, nonce + "." + deviceId)
        deviceSecret:
          type: string
          minLength: 32
          maxLength: 256
          description: The unit's own secret, which this control room will authenticate its sessions with.
    EnrollmentResponse:
      type: object
      additionalProperties: false
      required: [controlRoom]
      properties:
        controlRoom:
          type: string
          description: Name of the control room that adopted the unit.
    DesiredProfile:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 63
          description: Firmware profile name. Empty or absent clears the desired state.
    MeetingState:
      type: string
      description: "requested = asked, the unit has not confirmed; recording; closing = stop asked, file being closed; transcribing; ready; no_transcript = audio only, retryable; cut = the unit vanished, audio kept up to that point."
      enum: [requested, recording, closing, transcribing, ready, no_transcript, cut]
    Meeting:
      type: object
      required: [id, deviceId, state, requestedBy, requestedAt, durationMs, audioBytes, hasAudio, keep]
      properties:
        id:
          type: string
          format: uuid
        deviceId:
          type: string
        state:
          $ref: "#/components/schemas/MeetingState"
        requestedBy:
          type: string
          enum: [gesture, dashboard, voice]
        requestedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        endReason:
          type: string
          enum: [gesture, dashboard, voice, silence, max_duration, device_lost, room_lost]
        durationMs:
          type: integer
          format: int64
          description: Recorded duration; while recording, the live duration so far (RM-14).
        audioBytes:
          type: integer
          format: int64
        hasAudio:
          type: boolean
        keep:
          type: boolean
          description: Excluded from retention (RM-45).
        deletedAt:
          type: string
          format: date-time
        transcript:
          $ref: "#/components/schemas/MeetingTranscript"
        transcriptError:
          type: string
          description: Why the transcription failed (RM-33), with state no_transcript.
        summary:
          $ref: "#/components/schemas/MeetingSummary"
    MeetingTranscript:
      type: object
      required: [text, segments, diarized]
      properties:
        language:
          type: string
          description: ISO-639-1, when known.
        text:
          type: string
          description: 'The whole transcript, one "Speaker: text" line per segment.'
        segments:
          type: array
          items:
            $ref: "#/components/schemas/MeetingSegment"
        speakers:
          type: object
          additionalProperties:
            type: string
          description: Names the operator gave to speaker ids (RM-31).
        model:
          type: string
        diarized:
          type: boolean
          description: False when the fallback model transcribed without speakers.
    MeetingSegment:
      type: object
      required: [start, end, speaker, text]
      properties:
        start:
          type: number
          format: double
          description: Seconds from the start of the recording.
        end:
          type: number
          format: double
        speaker:
          type: string
          description: 'Speaker id ("Hablante 1"); empty without diarization.'
        text:
          type: string
    MeetingSummary:
      type: object
      required: [text, agreements, actions, model, generatedAt]
      properties:
        language:
          type: string
        text:
          type: string
        agreements:
          type: array
          items:
            type: string
        actions:
          type: array
          items:
            type: string
        model:
          type: string
          description: Generated automatically by this model (RM-32).
        generatedAt:
          type: string
          format: date-time
    MeetingPatch:
      type: object
      properties:
        speakers:
          type: object
          additionalProperties:
            type: string
          description: 'Speaker id → name; an empty name removes the alias (RM-31).'
        keep:
          type: boolean
          description: Exclude from retention (RM-45).
    MeetingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Meeting"
    MeetingStart:
      type: object
      properties:
        requestedBy:
          type: string
          enum: [gesture, dashboard, voice]
          default: dashboard
    MeetingStop:
      type: object
      properties:
        reason:
          type: string
          enum: [dashboard, voice, silence]
          default: dashboard
    MeetingReport:
      type: object
      required: [meetingId, state]
      properties:
        meetingId:
          type: string
          format: uuid
        state:
          type: string
          enum: [recording, stopped]
        reason:
          type: string
          enum: [gesture, room_lost]
          description: Why the unit stopped (only with `stopped`).
    SessionRequest:
      type: object
      properties:
        kind:
          type: string
          enum: [conversation, meeting, announce]
          default: conversation
        meetingId:
          type: string
          format: uuid
        announcementId:
          type: string
          format: uuid
    AnnouncementInput:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
        reply:
          type: boolean
          default: false
          description: Stay listening after saying it, for an answer.
    Announcement:
      type: object
      additionalProperties: false
      required: [id, text, reply, delivery, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
        reply:
          type: boolean
        delivery:
          type: string
          enum: [conversation, lan, poll]
          description: >-
            conversation = said in the unit's open conversation; lan = ordered
            over the LAN (the poll carries it too); poll = waits for the next
            poll (up to 30 s).
        expiresAt:
          type: string
          format: date-time
    RecordingSummary:
      type: object
      additionalProperties: false
      required: [count, totalBytes, totalDurationMs]
      properties:
        count:
          type: integer
          format: int64
          minimum: 0
        totalBytes:
          type: integer
          format: int64
          minimum: 0
        totalDurationMs:
          type: integer
          format: int64
          minimum: 0
        lastCapturedAt:
          type: string
          format: date-time
