name: Publish Sebastian Server Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (semver, no leading v)"
        required: true
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      repository:
        description: "Repository to build from (default: this one)"
        required: false
        type: string
        default: ""
      ref:
        description: "Git ref to build (default: the triggering ref)"
        required: false
        type: string
        default: ""
    secrets:
      HARBOR_USERNAME:
        required: true
      HARBOR_PASSWORD:
        required: true

env:
  REGISTRY: ${{ vars.REGISTRY || 'gauss.nexolabs.dev' }}
  IMAGE: sebastian/server
  BRIDGE_IMAGE: sebastian/airplay-bridge

jobs:
  build:
    runs-on: ${{ vars.RUNNER || 'herschel-runners' }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
      - name: Log into registry
        env:
          HARBOR_USER: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASS: ${{ secrets.HARBOR_PASSWORD }}
        run: echo "${HARBOR_PASS}" | docker login "${REGISTRY}" -u "${HARBOR_USER}" --password-stdin
      - name: Build and push server
        run: |
          VERSION="v${{ inputs.version }}"
          docker build \
            -t "${REGISTRY}/${IMAGE}:${VERSION}" \
            -t "${REGISTRY}/${IMAGE}:latest" \
            server
          docker push "${REGISTRY}/${IMAGE}:${VERSION}"
          docker push "${REGISTRY}/${IMAGE}:latest"
      - name: Build and push the AirPlay bridge
        run: |
          VERSION="v${{ inputs.version }}"
          docker build \
            -f server/Dockerfile.airplay-bridge \
            -t "${REGISTRY}/${BRIDGE_IMAGE}:${VERSION}" \
            -t "${REGISTRY}/${BRIDGE_IMAGE}:latest" \
            server
          docker push "${REGISTRY}/${BRIDGE_IMAGE}:${VERSION}"
          docker push "${REGISTRY}/${BRIDGE_IMAGE}:latest"
