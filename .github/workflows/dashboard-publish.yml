name: Publish Sebastian Dashboard Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (semver, no leading v)"
        required: true
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      repository:
        description: "Repository to build from (default: this one)"
        required: false
        type: string
        default: ""
      ref:
        description: "Git ref to build (default: the triggering ref)"
        required: false
        type: string
        default: ""
    secrets:
      HARBOR_USERNAME:
        required: true
      HARBOR_PASSWORD:
        required: true

env:
  REGISTRY: ${{ vars.REGISTRY || 'gauss.nexolabs.dev' }}
  IMAGE: sebastian/dashboard

jobs:
  build:
    runs-on: ${{ vars.RUNNER || 'herschel-runners' }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
      - name: Log into registry
        env:
          HARBOR_USER: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASS: ${{ secrets.HARBOR_PASSWORD }}
        run: echo "${HARBOR_PASS}" | docker login "${REGISTRY}" -u "${HARBOR_USER}" --password-stdin
      # The embedded installer ships the factory firmware image so a control
      # room installs the firmware it is compatible with (functional spec RF-04).
      # firmware-publish built that image once and attached it to the firmware
      # release of the same version (dashboard and firmware are linked-versions).
      - name: Fetch the released firmware for the embedded installer
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ inputs.repository || github.repository }}
          TAG: firmware-v${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p web-installer/public/firmware
          gh release download "$TAG" --repo "$REPO" --pattern sebastian-esp32s3-merged.bin \
            --dir web-installer/public/firmware --clobber
          bin=web-installer/public/firmware/sebastian-esp32s3-merged.bin
          test -f "$bin" || { echo "release $TAG of $REPO has no image attached"; exit 1; }
          magic="$(od -An -tx1 -N1 "$bin" | tr -d ' ')"
          [ "$magic" = "e9" ] || { echo "$bin is not an ESP image (first byte $magic)"; exit 1; }
          echo "installer ships firmware $TAG ($(du -h "$bin" | cut -f1))"
      # The version shown next to the flash button is the released one, so the
      # installer never lies about what it ships.
      - name: Stamp the firmware version into the installer manifest
        run: |
          jq --arg v "${{ inputs.version }}" '.version = $v' web-installer/public/manifest.json > manifest.tmp
          mv manifest.tmp web-installer/public/manifest.json
      - name: Build and push dashboard
        run: |
          VERSION="v${{ inputs.version }}"
          docker build \
            -f dashboard/Dockerfile \
            -t "${REGISTRY}/${IMAGE}:${VERSION}" \
            -t "${REGISTRY}/${IMAGE}:latest" \
            .
          docker push "${REGISTRY}/${IMAGE}:${VERSION}"
          docker push "${REGISTRY}/${IMAGE}:latest"
