name: Deploy GitHub Pages

# Publishes the public web installer with the factory firmware of a release.
# It never compiles: firmware-publish built the image once and attached it to
# the firmware-v<version> release; this workflow downloads it. It runs from
# the release workflow (with that version) and when the installer app itself
# changes on main (then it ships the latest released firmware).

on:
  push:
    branches: [main]
    paths:
      - "web-installer/**"
      - ".github/workflows/pages.yml"
  workflow_call:
    inputs:
      version:
        description: "Firmware release to ship (semver, no leading v); empty = the latest firmware-v* release"
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      version:
        description: "Firmware release to ship (semver, no leading v); empty = the latest firmware-v* release"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

# Don't cancel an in-progress Pages run: cancelling mid-deploy leaves the Pages
# deployment pending and the next run fails with "Deployment failed, try again
# later". Let each deploy finish (GitHub's own Pages workflow does the same).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: vars.MIRROR_UPSTREAM == ''
    runs-on: ${{ vars.RUNNER || 'herschel-runners' }}
    steps:
      - uses: actions/checkout@v6

      # Build the React installer in CI (no committed build output). It writes to
      # ../docs/installer (vite outDir) and creates docs/installer/firmware/ via
      # public/, where the released image is dropped below.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: web-installer/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web-installer/pnpm-lock.yaml

      - name: Build the web installer (React → docs/installer)
        working-directory: web-installer
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Download the released firmware image
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$VERSION" ]; then
            VERSION="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName -q '.[].tagName' \
              | sed -n 's/^firmware-v//p' | sort -V | tail -1)"
            test -n "$VERSION" || { echo "no firmware-v* release to ship"; exit 1; }
          fi
          mkdir -p docs/installer/firmware
          gh release download "firmware-v$VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern sebastian-esp32s3-merged.bin --dir docs/installer/firmware --clobber
          bin=docs/installer/firmware/sebastian-esp32s3-merged.bin
          test -f "$bin" || { echo "release firmware-v$VERSION has no image attached"; exit 1; }
          magic="$(od -An -tx1 -N1 "$bin" | tr -d ' ')"
          [ "$magic" = "e9" ] || { echo "$bin is not an ESP image (first byte $magic)"; exit 1; }
          jq --arg v "$VERSION" '.version = $v' docs/installer/manifest.json > manifest.tmp
          mv manifest.tmp docs/installer/manifest.json
          echo "pages ships firmware $VERSION ($(du -h "$bin" | cut -f1))"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/installer

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ${{ vars.RUNNER || 'herschel-runners' }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
