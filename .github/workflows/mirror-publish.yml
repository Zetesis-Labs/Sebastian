name: Mirror Upstream Releases

# Runs only in a mirror fork (vars.MIRROR_UPSTREAM, e.g. Zetesis-Labs/Sebastian):
# publishes the latest upstream release of each component to this repo's
# registry (vars.REGISTRY) when that version is not there yet. The fork keeps
# the upstream code untouched and never cuts releases of its own.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency: ${{ github.workflow }}

permissions:
  contents: read

jobs:
  plan:
    if: vars.MIRROR_UPSTREAM != ''
    runs-on: ${{ vars.RUNNER || 'herschel-runners' }}
    outputs:
      agent: ${{ steps.missing.outputs.agent }}
      server: ${{ steps.missing.outputs.server }}
      dashboard: ${{ steps.missing.outputs.dashboard }}
      helm: ${{ steps.missing.outputs.helm }}
    steps:
      - id: missing
        env:
          UPSTREAM: ${{ vars.MIRROR_UPSTREAM }}
          REGISTRY: ${{ vars.REGISTRY }}
          HARBOR_USER: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASS: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          latest() {
            git ls-remote --tags --refs "https://github.com/${UPSTREAM}.git" "refs/tags/$1-v*" \
              | sed "s#.*refs/tags/$1-v##" | sort -V | tail -1
          }
          published() {
            skopeo inspect --raw --creds "${HARBOR_USER}:${HARBOR_PASS}" \
              "docker://${REGISTRY}/sebastian/$1:$2" >/dev/null 2>&1
          }
          plan() {
            local component=$1 image=$2 prefix=$3 version
            version=$(latest "$component")
            if [ -n "$version" ] && ! published "$image" "${prefix}${version}"; then
              echo "$component $version missing"
              echo "$component=$version" >> "$GITHUB_OUTPUT"
            fi
          }
          plan agent agent v
          plan server server v
          plan dashboard dashboard v
          plan helm sebastian ""

  publish-images:
    needs: plan
    if: needs.plan.outputs.agent != ''
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ needs.plan.outputs.agent }}
      repository: ${{ vars.MIRROR_UPSTREAM }}
      ref: agent-v${{ needs.plan.outputs.agent }}
    secrets:
      HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}

  publish-server:
    needs: plan
    if: needs.plan.outputs.server != ''
    uses: ./.github/workflows/server-publish.yml
    with:
      version: ${{ needs.plan.outputs.server }}
      repository: ${{ vars.MIRROR_UPSTREAM }}
      ref: server-v${{ needs.plan.outputs.server }}
    secrets:
      HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}

  publish-dashboard:
    needs: plan
    if: needs.plan.outputs.dashboard != ''
    uses: ./.github/workflows/dashboard-publish.yml
    with:
      version: ${{ needs.plan.outputs.dashboard }}
      repository: ${{ vars.MIRROR_UPSTREAM }}
      ref: dashboard-v${{ needs.plan.outputs.dashboard }}
    secrets:
      HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}

  publish-helm:
    needs: plan
    if: needs.plan.outputs.helm != ''
    uses: ./.github/workflows/helm-publish.yml
    with:
      version: ${{ needs.plan.outputs.helm }}
      repository: ${{ vars.MIRROR_UPSTREAM }}
      ref: helm-v${{ needs.plan.outputs.helm }}
    secrets:
      HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}

  # Opens a PR in the mirror's GitOps repo (vars.MIRROR_BUMP_REPO) with the
  # versions just published — the mirror's counterpart of bump-mileto.
  bump:
    needs: [plan, publish-images, publish-server, publish-dashboard, publish-helm]
    if: |
      always() && vars.MIRROR_BUMP_REPO != '' &&
      needs.plan.result == 'success' &&
      (needs.plan.outputs.agent != '' || needs.plan.outputs.server != '' ||
       needs.plan.outputs.dashboard != '' || needs.plan.outputs.helm != '') &&
      needs.publish-images.result != 'failure' &&
      needs.publish-server.result != 'failure' &&
      needs.publish-dashboard.result != 'failure' &&
      needs.publish-helm.result != 'failure'
    runs-on: ${{ vars.RUNNER || 'herschel-runners' }}
    env:
      ENV_FILE: ${{ vars.MIRROR_BUMP_ENV_FILE || 'envs/prod/env.json' }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ vars.MIRROR_BUMP_REPO }}
          token: ${{ secrets.MIRROR_BUMP_TOKEN }}
          path: gitops
      - name: Bump env.json
        env:
          AGENT: ${{ needs.plan.outputs.agent }}
          SERVER: ${{ needs.plan.outputs.server }}
          DASHBOARD: ${{ needs.plan.outputs.dashboard }}
          HELM: ${{ needs.plan.outputs.helm }}
        run: |
          set -euo pipefail
          cd gitops
          tmp=$(mktemp)
          jq --arg agent "$AGENT" --arg server "$SERVER" --arg dashboard "$DASHBOARD" --arg helm "$HELM" '
            (if $agent     != "" then .agentImageTag = "v\($agent)" | .controlPlaneImageTag = "v\($agent)" else . end) |
            (if $server    != "" then .serverImageTag = "v\($server)" else . end) |
            (if $dashboard != "" then .dashboardImageTag = "v\($dashboard)" else . end) |
            (if $helm      != "" then .chartVersion = $helm else . end)
          ' "$ENV_FILE" > "$tmp"
          mv "$tmp" "$ENV_FILE"
          git diff "$ENV_FILE"
      - name: Commit and open PR
        env:
          GH_TOKEN: ${{ secrets.MIRROR_BUMP_TOKEN }}
          SUMMARY: "agent=${{ needs.plan.outputs.agent }} server=${{ needs.plan.outputs.server }} dashboard=${{ needs.plan.outputs.dashboard }} helm=${{ needs.plan.outputs.helm }}"
        run: |
          set -euo pipefail
          cd gitops
          if git diff --quiet; then
            echo "No env.json changes to push."
            exit 0
          fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          BRANCH="auto-bump/sebastian-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add "$ENV_FILE"
          git commit -m "chore(prod): bump Sebastian images and chart" -m "Published by ${{ github.repository }} from ${{ vars.MIRROR_UPSTREAM }}: ${SUMMARY}."
          git push origin "$BRANCH"
          gh pr create \
            --repo "${{ vars.MIRROR_BUMP_REPO }}" \
            --title "chore(prod): bump Sebastian — ${SUMMARY}" \
            --body "Automated bump after ${{ github.repository }} published new upstream releases (${SUMMARY}). Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --head "$BRANCH" \
            --base main
