{{- if .Values.server.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sebastian.fullname" . }}-server
  labels:
    {{- include "sebastian.labels" . | nindent 4 }}
    {{- include "sebastian.selectorLabels" (dict "ctx" . "component" "server") | nindent 4 }}
spec:
  replicas: {{ .Values.server.replicaCount }}
  {{- if .Values.server.hostPort }}
  # A surge pod cannot bind the same node hostPort during a rollout.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "sebastian.selectorLabels" (dict "ctx" . "component" "server") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sebastian.labels" . | nindent 8 }}
        {{- include "sebastian.selectorLabels" (dict "ctx" . "component" "server") | nindent 8 }}
      annotations:
        # The server reads the profiles file at boot only: a change rolls it.
        checksum/agent-profiles: {{ include (print $.Template.BasePath "/server/agent-profiles.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "sebastian.appSecurityContext" . | nindent 8 }}
      initContainers:
        - name: migrate
          image: "{{ .Values.server.image.repository }}:{{ .Values.server.image.tag }}"
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          command: ["/usr/local/bin/sebastian-migrate"]
          securityContext:
            {{- include "sebastian.containerSecurityContext" . | nindent 12 }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "server.existingSecret must be set" .Values.server.existingSecret }}
                  key: DATABASE_URL
      containers:
        - name: server
          image: "{{ .Values.server.image.repository }}:{{ .Values.server.image.tag }}"
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          securityContext:
            {{- include "sebastian.containerSecurityContext" . | nindent 12 }}
          env:
            {{- include "sebastian.livekitEnv" .Values.server | nindent 12 }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.existingSecret }}
                  key: DATABASE_URL
            - name: SEBASTIAN_SERVER_ADDRESS
              value: ":{{ .Values.server.service.targetPort }}"
            - name: SEBASTIAN_CONTROL_ROOM_NAME
              value: {{ .Values.server.fleet.controlRoomName | quote }}
            - name: SEBASTIAN_PUBLIC_API_URL
              value: {{ .Values.server.fleet.publicApiURL | quote }}
            - name: SEBASTIAN_SYSLOG_IP
              value: {{ .Values.server.fleet.syslogIP | quote }}
            - name: SEBASTIAN_SYSLOG_PORT
              value: {{ .Values.server.fleet.syslogPort | quote }}
            - name: SEBASTIAN_DISCOVERY_ENABLED
              value: {{ .Values.server.fleet.discoveryEnabled | quote }}
            - name: SEBASTIAN_ORG_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "server.existingSecret must be set" .Values.server.existingSecret }}
                  key: SEBASTIAN_ORG_SECRET
                  optional: true
            - name: SEBASTIAN_AGENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.existingSecret }}
                  key: SEBASTIAN_AGENT_SECRET
                  optional: true
            - name: SEBASTIAN_MEETINGS_DIR
              value: {{ .Values.server.meetings.dir | quote }}
            - name: SEBASTIAN_MEETING_MAX_DURATION
              value: {{ .Values.server.meetings.maxDuration | quote }}
            - name: SEBASTIAN_MEETING_RETENTION_DAYS
              value: {{ .Values.server.meetings.retentionDays | quote }}
            - name: SEBASTIAN_MEETING_SUMMARY
              value: {{ .Values.server.meetings.summary | quote }}
            - name: SEBASTIAN_SUMMARY_MODEL
              value: {{ .Values.server.meetings.summaryModel | quote }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.existingSecret }}
                  key: OPENAI_API_KEY
                  optional: true
            - name: SEBASTIAN_ADMIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.existingSecret }}
                  key: SEBASTIAN_ADMIN_SECRET
            - name: SEBASTIAN_SECRETS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.existingSecret }}
                  key: SEBASTIAN_SECRETS_KEY
                  optional: true
            # Always set, even with no profiles: an empty list retires the
            # Kubernetes-owned ones instead of leaving them read-only forever.
            - name: SEBASTIAN_AGENT_PROFILES_FILE
              value: /etc/sebastian/agent-profiles.json
          ports:
            - name: http
              containerPort: {{ .Values.server.service.targetPort }}
              protocol: TCP
              {{- if .Values.server.hostPort }}
              hostPort: {{ .Values.server.hostPort }}
              {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: meetings
              mountPath: {{ .Values.server.meetings.dir }}
            - name: agent-profiles
              mountPath: /etc/sebastian
              readOnly: true
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
{{- end }}
      volumes:
        - name: agent-profiles
          configMap:
            name: {{ include "sebastian.fullname" . }}-agent-profiles
        - name: meetings
          {{- if .Values.server.meetings.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "sebastian.fullname" . }}-meetings
          {{- else }}
          emptyDir: {}
          {{- end }}
