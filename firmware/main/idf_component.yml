dependencies:
  idf: ">=5.4"
  # override_path: copia local en components/livekit con UN parche (peer.c:
  # no_auto_reconnect=true, mata el SCTP INIT storm — esp-webrtc-solution#186).
  # Para volver al componente del registry: quita override_path y borra components/livekit.
  livekit/livekit:
    version: "0.3.10"
    override_path: "../components/livekit"
  livekit/sandbox_token: "~0.1.0"
  livekit/example_utils: "~0.2.0"
  espressif/esp_codec_dev: "~1.4"
  # USB-mic mode (CONFIG_SEBASTIAN_USB_MIC): TinyUSB UAC2 device — the XVF comms
  # beam exposed to the host as a plug-and-play USB microphone.
  espressif/usb_device_uac: "~1.2"
  # Fleet: the unit announces itself on the LAN (_sebastian._tcp) so any control
  # room lists it, adopted or not (docs/implementation/11-fleet-adoption-control-room.md).
  espressif/mdns: "~1.8"
  # dependencies.lock cannot hold these: the component manager discards a lock
  # whose livekit override_path is relative (it cannot evaluate it while
  # loading) and re-solves to the newest releases. Pinned to the versions in the
  # lock, validated on hardware; CI fails if the build resolves anything else.
  espressif/dl_fft: "0.7.0"
  espressif/esp-nn: "1.4.1"
  espressif/esp32-camera: "2.1.7"
  espressif/esp_h264: "1.4.1"
  espressif/esp_jpeg: "1.3.1"
  espressif/esp_sccb_intf: "0.0.9"
